name: neiroot
x-core-env: &core-env
  DATABASE_URL: postgres://core_app:${CORE_APP_PASSWORD}@postgres:5432/core?sslmode=disable
  PUBLIC_URL: https://localhost:8443
  OIDC_ISSUER: https://localhost:8443/auth/realms/neiroot
  OIDC_INTERNAL_ISSUER: http://keycloak:8080/auth/realms/neiroot
  KEYCLOAK_INTERNAL_URL: http://keycloak:8080/auth
  KEYCLOAK_PROVISIONER_SECRET: ${KEYCLOAK_PROVISIONER_SECRET}
x-bff-env: &bff-env
  DATABASE_URL: postgres://bff_app:${BFF_APP_PASSWORD}@postgres:5432/bff?sslmode=disable
  PUBLIC_URL: https://localhost:8443
  CORE_URL: http://core:8080
  OIDC_ISSUER: https://localhost:8443/auth/realms/neiroot
  OIDC_INTERNAL_ISSUER: http://keycloak:8080/auth/realms/neiroot
  KEYCLOAK_WEB_SECRET: ${KEYCLOAK_WEB_SECRET}
  SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY}
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./.local/pg-init.sql:/docker-entrypoint-initdb.d/01-neiroot.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0@sha256:b0f60d489d51c5d113390bdf5461d4c06e6051be026c05549f2e1e10ec352bcc
    command: [start, --import-realm, --spi-theme--cache-themes=false, --spi-theme--cache-templates=false, --spi-theme--static-max-age=-1]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/auth
      KC_DB_USERNAME: auth_app
      KC_DB_PASSWORD: ${AUTH_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: neiroot-local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: 'true'
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_MANAGEMENT_RELATIVE_PATH: /
      KC_HOSTNAME: https://localhost:8443/auth
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: 'true'
    volumes:
      - ./.local/neiroot-realm.json:/opt/keycloak/data/import/neiroot-realm.json:ro
      - ./infra/keycloak/themes/neiroot:/opt/keycloak/themes/neiroot:ro
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; IFS= read -r line <&3; [[ \"$$line\" == *\"200\"* ]]'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    restart: unless-stopped
  core-migrate:
    build: {context: ., dockerfile: infra/Dockerfile.service, args: {SERVICE: core}}
    environment:
      MIGRATE_ONLY: 'true'
      MIGRATION_DATABASE_URL: postgres://core_owner:${CORE_OWNER_PASSWORD}@postgres:5432/core?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}
    restart: 'no'
  bff-migrate:
    build: {context: ., dockerfile: infra/Dockerfile.service, args: {SERVICE: bff}}
    environment:
      MIGRATE_ONLY: 'true'
      MIGRATION_DATABASE_URL: postgres://bff_owner:${BFF_OWNER_PASSWORD}@postgres:5432/bff?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}
    restart: 'no'
  core:
    build: {context: ., dockerfile: infra/Dockerfile.service, args: {SERVICE: core}}
    environment: *core-env
    depends_on:
      core-migrate: {condition: service_completed_successfully}
      keycloak: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://localhost:8080/ready']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  bff:
    build: {context: ., dockerfile: infra/Dockerfile.service, args: {SERVICE: bff}}
    environment: *bff-env
    depends_on:
      bff-migrate: {condition: service_completed_successfully}
      core: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://localhost:8080/ready']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  web:
    build: {context: ., dockerfile: infra/Dockerfile.web}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/health']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  traefik:
    image: traefik:v3.7.13@sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0
    command: [--configFile=/etc/traefik/traefik.yml]
    ports: ['127.0.0.1:8443:8443']
    volumes:
      - ./infra/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infra/routes.yml:/etc/traefik/routes.yml:ro
      - ./.local/localhost.pem:/certs/localhost.pem:ro
      - ./.local/localhost-key.pem:/certs/localhost-key.pem:ro
    depends_on:
      web: {condition: service_healthy}
      bff: {condition: service_healthy}
    restart: unless-stopped
volumes:
  pgdata:
